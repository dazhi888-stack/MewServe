[project]
name = "mewserve"
version = "0.1.0"
description = "Stateless e-commerce customer service powered by DeepSeek with RAG"
requires-python = ">=3.11"
dependencies = [
    "anyio>=4,<5",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "langchain-core>=1,<2",
    "langchain-deepseek>=1,<2",
    "chromadb>=1,<2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.7,<3",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
# 演示页面（Streamlit）为可选依赖，生产部署后端时无需安装。
demo = ["streamlit>=1.40,<2"]

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
